<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nikita's QA Study Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f6f8;
  --white:#ffffff;
  --border:#e4e6ea;
  --border2:#d1d5db;
  --text:#111827;
  --muted:#6b7280;
  --muted2:#9ca3af;
  --accent:#16a34a;
  --accent-bg:#f0fdf4;
  --accent-border:#bbf7d0;
  --blue:#2563eb;
  --blue-bg:#eff6ff;
  --sidebar-w:240px;
  --header-h:60px;
  --strip-h:72px;
}
body{font-family:'Inter',sans-serif;font-size:14px;background:var(--bg);color:var(--text);line-height:1.5}

/* HEADER */
.hdr{height:var(--header-h);background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:200}
.hdr-left{display:flex;align-items:center;gap:12px}
.hdr-logo{width:28px;height:28px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center}
.hdr-logo svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5}
.hdr-title{font-size:15px;font-weight:600}
.hdr-sub{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:1px}
.hdr-reset{font-size:12px;color:var(--muted);background:none;border:1px solid var(--border2);border-radius:6px;padding:5px 12px;cursor:pointer;font-family:'Inter',sans-serif}
.hdr-reset:hover{color:#dc2626;border-color:#fca5a5}

/* PROGRESS STRIP */
.strip{height:var(--strip-h);background:var(--white);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:32px;position:sticky;top:var(--header-h);z-index:190}
.strip-main{flex:1}
.strip-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.strip-label{font-size:12px;color:var(--muted)}
.strip-pct{font-size:20px;font-weight:600;color:var(--accent);font-family:'JetBrains Mono',monospace}
.strip-track{height:6px;background:var(--border);border-radius:6px;overflow:hidden}
.strip-fill{height:6px;background:var(--accent);border-radius:6px;transition:width 0.4s ease}
.strip-stats{display:flex;gap:20px;flex-shrink:0}
.strip-stat{text-align:center}
.strip-stat-num{font-size:18px;font-weight:600;font-family:'JetBrains Mono',monospace;color:var(--text)}
.strip-stat-lab{font-size:11px;color:var(--muted);margin-top:1px}

/* LAYOUT */
.layout{display:flex}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--white);border-right:1px solid var(--border);position:sticky;top:calc(var(--header-h) + var(--strip-h));height:calc(100vh - var(--header-h) - var(--strip-h));overflow-y:auto;padding:16px 0}
.sb-label{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--muted2);padding:0 16px 8px;text-transform:uppercase;letter-spacing:0.06em}
.sb-item{display:flex;align-items:center;gap:10px;padding:7px 16px;cursor:pointer;border-left:2px solid transparent;text-decoration:none;transition:background 0.1s}
.sb-item:hover{background:var(--bg)}
.sb-item.active{border-left-color:var(--accent);background:var(--accent-bg)}
.sb-dot{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--border2);flex-shrink:0;transition:all 0.2s}
.sb-dot.done{background:var(--accent);border-color:var(--accent)}
.sb-dot.partial{background:#fbbf24;border-color:#fbbf24}
.sb-text{font-size:12px;color:var(--muted);flex:1;line-height:1.3}
.sb-item.active .sb-text{color:var(--text);font-weight:500}
.sb-pct{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--muted2)}

/* CONTENT */
.content{flex:1;padding:28px 32px;max-width:900px}

/* PHASE */
.phase{margin-bottom:40px;scroll-margin-top:calc(var(--header-h) + var(--strip-h) + 20px)}
.phase-hdr{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.phase-pill{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;padding:3px 10px;border-radius:20px;border:1px solid;text-transform:uppercase;letter-spacing:0.05em;flex-shrink:0}
.phase-title{font-size:16px;font-weight:600}
.phase-weeks{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-left:auto}
.phase-milestone{display:inline-flex;align-items:center;gap:5px;font-size:11px;background:#fffbeb;color:#92400e;border:1px solid #fde68a;border-radius:4px;padding:3px 9px;margin-bottom:10px;font-family:'JetBrains Mono',monospace}
.phase-barwrap{height:3px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:16px}
.phase-barfill{height:3px;border-radius:3px;transition:width 0.4s}

/* SECTION CARD */
.sec-card{background:var(--white);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden}
.sec-hdr{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;transition:background 0.1s;user-select:none}
.sec-hdr:hover{background:var(--bg)}
.sec-ck{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.15s;cursor:pointer;background:var(--white)}
.sec-ck.done{background:var(--accent);border-color:var(--accent)}
.sec-ck svg{display:none;width:10px;height:10px;stroke:#fff;fill:none;stroke-width:3}
.sec-ck.done svg{display:block}
.sec-badge{font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 8px;border-radius:4px;border:1px solid;flex-shrink:0}
.sec-title{flex:1;font-size:13px;font-weight:500}
.sec-prog{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-right:4px}
.sec-hours{font-size:10px;font-family:'JetBrains Mono',monospace;background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;border-radius:4px;padding:2px 7px;margin-right:6px;flex-shrink:0}
.course-hrs{font-size:10px;font-family:'JetBrains Mono',monospace;background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe;border-radius:3px;padding:1px 6px;margin-left:auto;flex-shrink:0;white-space:nowrap}
.sec-chev{width:16px;height:16px;color:var(--muted2);transition:transform 0.2s;flex-shrink:0}
.sec-chev.open{transform:rotate(180deg)}
.sec-body{display:none;border-top:1px solid var(--border)}
.sec-body.open{display:block}

/* ITEMS */
.item{border-bottom:1px solid var(--border)}
.item:last-of-type{border-bottom:none}
.item-hdr{display:flex;align-items:flex-start;gap:10px;padding:10px 16px;cursor:pointer;transition:background 0.1s}
.item-hdr:hover{background:var(--bg)}
.item-ck{width:15px;height:15px;border-radius:3px;border:1.5px solid var(--border2);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all 0.15s;cursor:pointer}
.item-ck.done{background:var(--accent);border-color:var(--accent)}
.item-ck svg{display:none;width:8px;height:8px;stroke:#fff;fill:none;stroke-width:3}
.item-ck.done svg{display:block}
.item-lbl{flex:1;font-size:13px;color:var(--text);line-height:1.5}
.item-lbl.done{color:var(--muted2);text-decoration:line-through;text-decoration-color:var(--border2)}
.item-chev{width:14px;height:14px;color:var(--muted2);transition:transform 0.2s;margin-top:3px;flex-shrink:0}
.item-chev.open{transform:rotate(180deg)}
.item-detail{display:none;padding:10px 16px 14px 41px;background:#fafafa;border-top:1px solid var(--border)}
.item-detail.open{display:block}

/* SUBTASKS */
.sub{display:flex;align-items:flex-start;gap:8px;margin-bottom:5px;cursor:pointer;padding:2px 0}
.sub-ck{width:12px;height:12px;border-radius:2px;border:1.5px solid var(--border2);flex-shrink:0;margin-top:3px;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.sub-ck.done{background:var(--accent);border-color:var(--accent)}
.sub-ck svg{display:none;width:7px;height:7px;stroke:#fff;fill:none;stroke-width:3}
.sub-ck.done svg{display:block}
.sub-lbl{font-size:12px;color:var(--muted);line-height:1.5}
.sub-lbl.done{text-decoration:line-through;text-decoration-color:var(--border2)}

/* COURSES */
.courses{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.courses-lbl{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--muted2);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px}
.course-a{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--blue);text-decoration:none;margin-bottom:4px}
.course-a:hover{text-decoration:underline}
.course-a svg{width:11px;height:11px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.5}

/* NOTES — always visible below each section body */
.notes-wrap{border-top:2px solid var(--accent-border);background:var(--accent-bg);padding:14px 16px}
.notes-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.notes-lbl{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--accent);font-weight:500;text-transform:uppercase;letter-spacing:0.05em;display:flex;align-items:center;gap:5px}
.notes-lbl svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.notes-saved{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--accent);opacity:0;transition:opacity 0.3s}
.notes-saved.show{opacity:1}
.notes-ta{width:100%;min-height:90px;resize:vertical;background:var(--white);border:1px solid var(--accent-border);border-radius:6px;padding:10px 12px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text);line-height:1.6;outline:none;transition:border-color 0.15s}
.notes-ta:focus{border-color:var(--accent)}
.notes-ta::placeholder{color:var(--muted2)}

/* scrollbar */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

@media(max-width:680px){.sidebar{display:none}.content{padding:16px}.strip-stats{display:none}}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-left">
    <div class="hdr-logo"><svg viewBox="0 0 14 14"><polyline points="2,7 5,10 12,4"/></svg></div>
    <div><div class="hdr-title">QA Study Tracker</div><div class="hdr-sub">Nikita Bhargava — 12-week plan</div></div>
  </div>
  <button class="hdr-reset" onclick="confirmReset()">Reset all</button>
</header>

<div class="strip">
  <div class="strip-main">
    <div class="strip-row">
      <span class="strip-label">Overall progress — <span id="done-c">0</span> of <span id="total-c">0</span> skills complete</span>
      <span class="strip-pct" id="strip-pct">0%</span>
    </div>
    <div class="strip-track"><div class="strip-fill" id="strip-fill" style="width:0%"></div></div>
  </div>
  <div class="strip-stats">
    <div class="strip-stat"><div class="strip-stat-num" id="sub-done">0</div><div class="strip-stat-lab">subtasks done</div></div>
    <div class="strip-stat"><div class="strip-stat-num" id="hrs-done">0h</div><div class="strip-stat-lab">of ~150h video</div></div>
  </div>
</div>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="content" id="content"></div>
</div>

:"ISTQB Foundation Level – Quality Gurus",u:"https://www.udemy.com/course/istqb-foundation-level-certification/",h:8},{n:"Software Testing Masterclass – Nicholas Kreidberg",u:"https://www.udemy.com/course/testerbootcamp/",h:10}]},{id:"defect-rca",label:"Defect triage & RCA",tasks:["Severity vs priority matrix","RCA techniques: 5 Whys, Fishbone","Production log analysis — reading stack traces","MTTR and MTTD concepts","Writing clear defect reports"],courses:[{n:"Software Testing Masterclass – Nicholas Kreidberg",u:"https://www.udemy.com/course/testerbootcamp/",h:10}]},{id:"reporting",label:"Stakeholder reporting",tasks:["QA dashboard: defect trends, coverage, pass/fail rate","Executive summary — what to include","Release readiness communication","Knowledge transfer session structure"],courses:[{n:"Business Communication – Chris Haroun",u:"https://www.udemy.com/course/business-communication-how-to-be-a-great-communicator/",h:5}]}]},{id:"domain-ai",badge:"Domain: AI",bc:"#7c3aed",bb:"#f5f3ff",title:"Domain — Conversational AI",items:[{id:"ai-testing",label:"Conversational AI testing concepts",tasks:["Intents, entities, dialog flows","Multi-turn conversations and context","Testing intent classification accuracy","Slot filling and fallback handling","Non-deterministic output testing strategies"],courses:[{n:"Building AI Apps with OpenAI APIs – Colt Steele",u:"https://www.udemy.com/course/openai-api-chatgpt-gpt4-with-python/",h:9}]}]},{id:"domain-iga",badge:"Domain: IGA",bc:"#d97706",bb:"#fffbeb",title:"Domain — Identity governance & ERP",items:[{id:"iga-core",label:"IGA & ERP concepts",tasks:["RBAC fundamentals","Identity lifecycle: joiner/mover/leaver","Segregation of Duties (SoD)","Access provisioning and deprovisioning flows","SailPoint IGA architecture overview","SAP module overview for QA context"],courses:[{n:"Cybersecurity & IAM Fundamentals",u:"https://www.udemy.com/course/identity-and-access-management/",h:5},{n:"SAP Overview for Beginners",u:"https://www.udemy. essibility-wcag-21/",h:5}]}]},{id:"messaging",badge:"Messaging",bc:"#7c3aed",bb:"#f5f3ff",title:"Async messaging",items:[{id:"servicebus",label:"Azure Service Bus",tasks:["Queues vs Topics vs Subscriptions","Connect with Python (azure-servicebus)","Send and receive messages in tests","Dead-letter queue concept","Test event-driven flows: trigger → validate message"],courses:[{n:"AZ-900 Azure Fundamentals – Scott Duffy",u:"https://www.udemy.com/course/az900-azure/",h:6}]},{id:"mqtt",label:"MQTT basics",tasks:["Pub/sub model — broker, topic, QoS levels","Install and run Mosquitto broker locally","Python paho-mqtt: subscribe, publish","Write a test that publishes and asserts message received"],courses:[{n:"MQTT Absolute Beginners Guide (~3h)",u:"https://www.udemy.com/course/mqtt-the-beginning/",h:3}]}]}]}];

const STORE='qa_v3';
let S={};
const ck='<svg viewBox="0 0 10 10"><polyline points="2,5 4.5,8 8,2"/></svg>';
const extSVG='<svg viewBox="0 0 11 11"><path d="M4 2H2a1 1 0 00-1 1v6a1 1 0 001 1h6a1 1 0 001-1V7"/><path d="M7 1h3v3"/><line x1="10" y1="1" x2="5" y2="6"/></svg>';
const chevSVG='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4,6 8,10 12,6"/></svg>';

function load(){try{S=JSON.parse(localStorage.getItem(STORE))||{};}catch(e){S={};}}
function save(){localStorage.setItem(STORE,JSON.stringify(S));}
function isOn(k){return!!S[k];}
function tog(k){S[k]=!S[k];save();}
function getNote(id){return S['n:'+id]||'';}
function setNote(id,v){S['n:'+id]=v;save();}

function counts(){
  let t=0,d=0,st=0,sd=0;
  PHASES.forEach(p=>p.sections.forEach(s=>s.items.forEach(it=>{
    t++;if(isOn('i:'+it.id))d++;
    it.tasks.forEach((_,ti)=>{st++;if(isOn('s:'+it.id+'_'+ti))sd++;});
  })));
  return{t,d,st,sd};
}
function pCount(p){let t=0,d=0;p.sections.forEach(s=>s.items.forEach(it=>{t++;if(isOn('i:'+it.id))d++;}));return{t,d};}
function sCount(s){let t=s.items.length,d=0;s.items.forEach(it=>{if(isOn('i:'+it.id))d++;});return{t,d};}

function updateGlobal(){
  const{t,d,st,sd}=counts();
  const pct=t?Math.round(d/t*100):0;
  document.getElementById('done-c').textContent=d;
  document.getElementById('total-c').textContent=t;
  document.getElementById('strip-pct').textContent=pct+'%';
  document.getElementById('strip-fill').style.width=pct+'%';
  document.getElementById('sub-done').textContent=sd;
  document.getElementById('hrs-done').textContent=Math.round(d*(150/t))+'h';
  updateSidebar();
}

function updateSidebar(){
  PHASES.forEach(p=>{
    const{t,d}=pCount(p);
    const dot=document.getElementById('sdot_'+p.id);
    const spct=document.getElementById('spct_'+p.id);
    const pbar=document.getElementById('pbar_'+p.id);
    if(dot){dot.className='sb-dot'+(d===t&&t>0?' done':d>0?' partial':'');}
    if(spct)spct.textContent=t?Math.round(d/t*100)+'%':'0%';
    if(pbar)pbar.style.width=(t?Math.round(d/t*100):0)+'%';
  });
}

function refreshSec(sec){
  const{t,d}=sCount(sec);
  const el=document.getElementById('sck_'+sec.id);
  const pg=document.getElementById('spg_'+sec.id);
  if(el){el.className='sec-ck'+(d===t&&t>0?' done':'');el.innerHTML=ck;}
  if(pg)pg.textContent=d+'/'+t;
}

function render(){
  load();
  // sidebar
  const sb=document.getElementById('sidebar');
  sb.innerHTML='<div class="sb-label">Phases</div>';
  PHASES.forEach(p=>{
    const{t,d}=pCount(p);
    const pct=t?Math.round(d/t*100):0;
    const a=document.createElement('a');
    a.className='sb-item';a.href='#'+p.id;
    a.innerHTML=`<div class="sb-dot${d===t&&t>0?' done':d>0?' partial':''}" id="sdot_${p.id}"></div><span class="sb-text">${p.label}: ${p.title}</span><span class="sb-pct" id="spct_${p.id}">${pct}%</span>`;
    sb.appendChild(a);
  });

  // content
  const ct=document.getElementById('content');
  ct.innerHTML='';
  PHASES.forEach(p=>{
    const{t,d}=pCount(p);
    const pct=t?Math.round(d/t*100):0;
    const pd=document.createElement('div');
    pd.className='phase';pd.id=p.id;
    pd.innerHTML=`
      <div class="phase-hdr">
        <span class="phase-pill" style="color:${p.color};border-color:${p.color};background:${p.colorBg}">${p.label}</span>
        <span class="phase-title">${p.title}</span>
        <span class="phase-weeks">${p.weeks} · ~${p.hours}h video</span>
      </div>
      ${p.milestone?`<div class="phase-milestone"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" style="width:12px;height:12px"><circle cx="6" cy="6" r="4.5"/><polyline points="4,6 5.5,7.5 8,4.5"/></svg>${p.milestone}</div>`:''}
      <div class="phase-barwrap"><div class="phase-barfill" id="pbar_${p.id}" style="background:${p.color};width:${pct}%"></div></div>`;
    p.sections.forEach(sec=>{pd.appendChild(buildSec(sec));});
    ct.appendChild(pd);
  });
  updateGlobal();
}

function buildSec(sec){
  const{t,d}=sCount(sec);
  const wrap=document.createElement('div');wrap.className='sec-card';

  // header
  const hdr=document.createElement('div');hdr.className='sec-hdr';
  const seenUrls=new Set();let uniqHrs=0;
  sec.items.forEach(it=>it.courses.forEach(c=>{if(c.h&&!seenUrls.has(c.u)){seenUrls.add(c.u);uniqHrs+=c.h;}}));
  const hrsLabel=uniqHrs>0?`~${uniqHrs}h`:'';
  hdr.innerHTML=`
    <div class="sec-ck${d===t&&t>0?' done':''}" id="sck_${sec.id}" title="Mark all complete">${ck}</div>
    <span class="sec-badge" style="color:${sec.bc};border-color:${sec.bc};background:${sec.bb}">${sec.badge}</span>
    <span class="sec-title">${sec.title}</span>
    ${hrsLabel?`<span class="sec-hours">${hrsLabel} video</span>`:''}
    <span class="sec-prog" id="spg_${sec.id}">${d}/${t}</span>
    <span class="sec-chev" id="schev_${sec.id}">${chevSVG}</span>`;

  hdr.querySelector('.sec-ck').addEventListener('click',e=>{
    e.stopPropagation();
    const allDone=sec.items.every(it=>isOn('i:'+it.id));
    sec.items.forEach(it=>{
      S['i:'+it.id]=!allDone;
      it.tasks.forEach((_,ti)=>{S['s:'+it.id+'_'+ti]=!allDone;});
    });
    save();refreshSection(sec);updateGlobal();
  });

  // body
  const body=document.createElement('div');body.className='sec-body';body.id='sbody_'+sec.id;
  sec.items.forEach(it=>body.appendChild(buildItem(it,sec)));

  // NOTES — always visible at bottom of section body
  const nw=document.createElement('div');nw.className='notes-wrap';
  nw.innerHTML=`
    <div class="notes-top">
      <span class="notes-lbl"><svg viewBox="0 0 12 12"><path d="M2 2h8v8H2z" stroke-linejoin="round"/><line x1="4" y1="5" x2="8" y2="5"/><line x1="4" y1="7" x2="7" y2="7"/></svg>Section notes</span>
      <span class="notes-saved" id="ns_${sec.id}">saved ✓</span>
    </div>
    <textarea class="notes-ta" id="nt_${sec.id}" placeholder="Key learnings, commands to remember, things to revisit, useful links...">${getNote(sec.id)}</textarea>`;
  body.appendChild(nw);

  hdr.addEventListener('click',()=>{
    const open=body.classList.toggle('open');
    document.getElementById('schev_'+sec.id).classList.toggle('open',open);
  });
  wrap.appendChild(hdr);wrap.appendChild(body);

  setTimeout(()=>{
    const ta=document.getElementById('nt_'+sec.id);
    if(!ta)return;
    let timer;
    ta.addEventListener('input',()=>{
      clearTimeout(timer);
      timer=setTimeout(()=>{
        setNote(sec.id,ta.value);
        const ns=document.getElementById('ns_'+sec.id);
        if(ns){ns.classList.add('show');setTimeout(()=>ns.classList.remove('show'),1500);}
      },500);
    });
  },0);

  return wrap;
}

function refreshSection(sec){
  const{t,d}=sCount(sec);
  const ckEl=document.getElementById('sck_'+sec.id);
  if(ckEl){ckEl.className='sec-ck'+(d===t&&t>0?' done':'');ckEl.innerHTML=ck;}
  const pg=document.getElementById('spg_'+sec.id);
  if(pg)pg.textContent=d+'/'+t;
  sec.items.forEach(it=>{
    const nd=isOn('i:'+it.id);
    const ic=document.getElementById('ick_'+it.id);const il=document.getElementById('il_'+it.id);
    if(ic){ic.className='item-ck'+(nd?' done':'');ic.innerHTML=ck;}
    if(il)il.className='item-lbl'+(nd?' done':'');
    it.tasks.forEach((_,ti)=>{
      const sd=isOn('s:'+it.id+'_'+ti);
      const sc=document.getElementById('sc_'+it.id+'_'+ti);const sl=document.getElementById('sl_'+it.id+'_'+ti);
      if(sc){sc.className='sub-ck'+(sd?' done':'');sc.innerHTML=ck;}
      if(sl)sl.className='sub-lbl'+(sd?' done':'');
    });
  });
}

function buildItem(it,sec){
  const done=isOn('i:'+it.id);
  const div=document.createElement('div');div.className='item';
  const hdr=document.createElement('div');hdr.className='item-hdr';
  hdr.innerHTML=`
    <div class="item-ck${done?' done':''}" id="ick_${it.id}">${ck}</div>
    <span class="item-lbl${done?' done':''}" id="il_${it.id}">${it.label}</span>
    <svg class="item-chev" id="ich_${it.id}" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3,5 7,9 11,5"/></svg>`;

  hdr.querySelector('.item-ck').addEventListener('click',e=>{
    e.stopPropagation();
    tog('i:'+it.id);
    const nd=isOn('i:'+it.id);
    document.getElementById('ick_'+it.id).className='item-ck'+(nd?' done':'');
    document.getElementById('ick_'+it.id).innerHTML=ck;
    document.getElementById('il_'+it.id).className='item-lbl'+(nd?' done':'');
    refreshSec(sec);updateSidebar();updateGlobal();
  });

  const det=document.createElement('div');det.className='item-detail';
  const subs=document.createElement('div');subs.style.marginBottom='4px';
  it.tasks.forEach((task,ti)=>{
    const sd=isOn('s:'+it.id+'_'+ti);
    const s=document.createElement('div');s.className='sub';
    s.innerHTML=`<div class="sub-ck${sd?' done':''}" id="sc_${it.id}_${ti}">${ck}</div><span class="sub-lbl${sd?' done':''}" id="sl_${it.id}_${ti}">${task}</span>`;
    s.addEventListener('click',()=>{
      tog('s:'+it.id+'_'+ti);
      const nd=isOn('s:'+it.id+'_'+ti);
      document.getElementById('sc_'+it.id+'_'+ti).className='sub-ck'+(nd?' done':'');
      document.getElementById('sc_'+it.id+'_'+ti).innerHTML=ck;
      document.getElementById('sl_'+it.id+'_'+ti).className='sub-lbl'+(nd?' done':'');
      updateGlobal();
    });
    subs.appendChild(s);
  });

  const cDiv=document.createElement('div');cDiv.className='courses';
  cDiv.innerHTML='<div class="courses-lbl">Udemy courses</div>'+
    it.courses.map(c=>`<a class="course-a" href="${c.u}" target="_blank" rel="noopener">${extSVG}${c.n.replace(/\s*\(~?\d+\.?[\d]*h\)/,'').replace(/\s*\(~?\d+h\)/,'')}${c.h?`<span class="course-hrs">~${c.h}h</span>`:''}</a>`).join('');

  det.appendChild(subs);det.appendChild(cDiv);

  hdr.addEventListener('click',()=>{
    const open=det.classList.toggle('open');
    document.getElementById('ich_'+it.id).classList.toggle('open',open);
  });
  div.appendChild(hdr);div.appendChild(det);
  return div;
}

function confirmReset(){
  if(confirm('Reset all progress and notes? This cannot be undone.')){
    localStorage.removeItem(STORE);S={};render();
  }
}

render();
</script>
